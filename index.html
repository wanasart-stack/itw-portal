<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ตรวจสอบผลการเรียน กศน.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <div><b>ตรวจสอบผลการเรียน</b><span>ข้อมูลจากระบบทะเบียน ITW51</span></div>
    </div>
    <div id="bandActions"><button class="btn ghost hidden" id="logoutBtn" type="button">ออกจากระบบ</button></div>
  </div>
</header>

<main id="viewLogin" class="wrap">
  <div class="org">
    <img class="org-logo" src="assets/logo.png" alt="โลโก้ศูนย์ส่งเสริมการเรียนรู้ระดับอำเภอเทิง"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'org-logo org-seal',textContent:'สกร.'}))">
    <div class="org-name">ศูนย์ส่งเสริมการเรียนรู้ระดับอำเภอเทิง</div>
  </div>
  <form class="login" id="loginForm" autocomplete="off">
    <h1>เข้าสู่ระบบนักศึกษา</h1>
    <p class="lead">ดูผลการเรียนรายวิชา เกรดเฉลี่ย ชั่วโมง กพช.และคุณสมบัติการจบของคุณ</p>
    <label for="inId">รหัสนักศึกษา</label>
    <input id="inId" type="text" inputmode="numeric" placeholder="เช่น 6713001234" required>
    <label for="inPw">รหัสผ่าน <span class="hint">เลขประจำตัวประชาชน 13 หลัก หรือเลข G</span></label>
    <div class="pw-wrap">
      <input id="inPw" type="password" placeholder="ไม่ต้องใส่ขีด" required>
      <button type="button" class="pw-eye" id="pwEye" aria-label="แสดงรหัสผ่าน" aria-pressed="false" title="แสดงรหัสผ่าน">
        <svg class="eye-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button class="btn" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    <div id="loginMsg" class="msg hidden" role="alert"></div>
    <div class="foot" id="dataStamp"></div>
  </form>
</main>

<main id="viewStudent" class="wrap hidden"></main>

<footer class="credit">
  <div>สร้างสรรค์โดย นายวนศาสตร์ วัฒนาสกุลลี</div>
  <div>ครู สกร.ระดับอำเภอเทิง</div>
</footer>

<script src="assets/core.js?v=4"></script>
<script src="assets/student.js?v=4"></script>
</body>
</html>
